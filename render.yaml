services:
  - type: worker
    name: btc-paper-trading
    runtime: python
    plan: starter
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    # 4 contas simuladas: conservador/agressivo x futures/spot. Só paper trading.
    startCommand: python -m btc_trend_pullback.paper --strategy ambas --profile both
    autoDeployTrigger: off
    disk:
      name: btc-paper-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: LIVE_TRADING_ENABLED
        value: "false"
      - key: BTC_PAPER_DIR
        value: /var/data
      # opcional, só para alertas: TELEGRAM_BOT_TOKEN e PAPER_ALERT_CHAT_ID (definir no painel do Render)
