services:
  - type: worker
    name: solana-memebot-monitor
    runtime: python
    plan: starter
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python telegram_bot.py
    autoDeployTrigger: off
    disk:
      name: solana-memebot-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: BOT_WALLET_FILE
        value: /var/data/wallet.json
      # Sem limite de perda diária (DAILY_LOSS_LIMIT_ENABLED=true liga de novo)
      - key: DAILY_LOSS_LIMIT_ENABLED
        value: "false"
      - key: MAX_ORDER_USD
        value: "38"
      # Sniper: US$ 38 por compra, no máximo 3 ordens ao mesmo tempo
      - key: SNIPER_ORDER_USD
        value: "38"
      - key: SNIPER_MAX_POSITIONS
        value: "3"
      - key: SNIPER_MIN_LIQUIDITY_USD
        value: "10000"
      - key: SNIPER_MAX_AGE_HOURS
        value: "48"
      - key: COPY_ORDER_USD
        value: "32"
      # No máximo 12 posições abertas ao mesmo tempo
      - key: COPY_MAX_POSITIONS
        value: "12"
      - key: MAX_OPEN_ORDERS
        value: "12"
      - key: MAX_POSITIONS
        value: "12"
      - key: COPY_MIN_HOLD_MINUTES
        value: "5"
      - key: COPY_MIN_ROUND_TRIPS
        value: "3"
      - key: COPY_AUTO_DISCOVERY_ENABLED
        value: "true"
      # A busca automática coloca carteiras novas sozinha até o limite de 20
      - key: COPY_AUTO_MAX_WALLETS
        value: "20"
      # Mensagens automáticas iguais: no máximo 1 vez a cada 2 h (compra/venda sempre avisa)
      - key: NOTIFY_REPEAT_HOURS
        value: "2"
      - key: COPY_DISCOVERY_INTERVAL_SECONDS
        value: "30"
      # Defina no painel (segredos): TELEGRAM_BOT_TOKEN, BOT_WALLET_ENCRYPTION_PASSPHRASE e
      # SOLANA_RPC_URL (RPC dedicado, necessário para a busca automática de carteiras)
      - key: SOLANA_RPC_URL
        sync: false
